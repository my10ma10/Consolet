stages: 
  - build
  - test
  - deploy

variables:
  BUILD_DEBUG_DIR: build_debug
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

before_script:
  - git submodule sync --recursive
  - git submodule update --init --recursive

build-job-debug: 
  stage: build
  script:
    - echo "=== GCC versions ==="
    - ls /usr/bin/gcc* 2>/dev/null || echo "No gcc found"
    - g++ --version
    - echo "=== CMake version ==="
    - cmake --version
    - echo "=== Test C++20 support ==="
    - echo 'int main(){return 0;}' | g++ -x c++ -std=c++20 - -o /dev/null 2>&1 && echo "C++20 works" || echo "C++20 NOT supported"
    - apt-get install -y cmake libsqlite3-dev libncurses-dev
    - cmake -S . -B ${BUILD_DEBUG_DIR} -DCMAKE_BUILD_TYPE=Debug 
    - cmake --build ${BUILD_DEBUG_DIR}
  tags: 
    - ubuntu

test-job:
  stage: test
  script:
    - ./build/tests/tests
  tags: 
    - ubuntu
  artifacts:
    name: ${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_test
    paths:
      - ${BUILD_DEBUG_DIR}/*.gcda
  needs: 
    - build-job-debug

coverage-job:
  stage: test
  script:
    - mkdir coverage/
    - lcov --capture --directory . --output-file coverage/coverage.info
    - lcov --remove coverage/coverage.info '*/external/*' '*/tests/*' -o coverage/coverage_filtered.info
    - lcov --extract coverage/coverage_filtered.info '*/src/*' -o coverage/coverage_final.info
    - genhtml coverage/coverage_final.info --output-directory coverage-html
  artifacts:  
    name: ${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_coverage
    paths:  
      - coverage/coverage-html
      - covetage/coverage_final.info
    expire_in: 1 day
  tags:
    - ubuntu
  needs: 
    - test-job