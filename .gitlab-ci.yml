stages: 
  - build
  - test
  - deploy

variables:
  BUILD_DEBUG_DIR: build_debug
  CURRENT_IMAGE: ubuntu:24.04
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

before_script:
  - git submodule sync --recursive
  - git submodule update --init --recursive

build-job-debug: 
  image: ${CURRENT_IMAGE}
  tags: 
    - docker
  stage: build
  script:
    - sudo apt-get update
    - sudo apt-get install -y gcc-11 g++-11
    
    - sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
    - sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
    
    - g++ --version 
    - docker --version
    
    - cmake -S . -B ${BUILD_DEBUG_DIR} \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_C_COMPILER=gcc-11 \
        -DCMAKE_CXX_COMPILER=g++-11 \
        -DCMAKE_CXX_STANDARD=20
    - cmake --build ${BUILD_DEBUG_DIR} --parallel 4

test-job:
  image: ${CURRENT_IMAGE}
  tags: 
    - docker
  stage: test
  script:
    - ./build/tests/tests
  artifacts:
    name: ${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_test
    paths:
      - ${BUILD_DEBUG_DIR}/*.gcda
  needs: 
    - build-job-debug

coverage-job:
  image: ${CURRENT_IMAGE}
  tags:
    - docker
  stage: test
  script:
    - mkdir coverage/
    - lcov --capture --directory . --output-file coverage/coverage.info
    - lcov --remove coverage/coverage.info '*/external/*' '*/tests/*' -o coverage/coverage_filtered.info
    - lcov --extract coverage/coverage_filtered.info '*/src/*' -o coverage/coverage_final.info
    - genhtml coverage/coverage_final.info --output-directory coverage-html
  artifacts:  
    name: ${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}_coverage
    paths:  
      - coverage/coverage-html
      - covetage/coverage_final.info
    expire_in: 1 day
  needs: 
    - test-job